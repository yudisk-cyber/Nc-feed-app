<style>
:root{--y:#fcee0a;--bg:#0b0b0b;--p:#151515;--t:#e8e8e8;--m:#8a8a8a;--c:#00f0ff;--r:#ff2a55;--rail:72px;--hh:110px}
@media(min-width:520px){:root{--rail:120px}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 "Rajdhani","Segoe UI",Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:2px solid var(--y);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:22px;letter-spacing:3px;color:var(--y);text-transform:uppercase}
h1 small{display:block;font-size:11px;color:var(--m);letter-spacing:2px}
#sb{background:none;border:1px solid var(--m);color:var(--t);width:38px;height:34px;display:flex;align-items:center;justify-content:center}
#sb.on{background:var(--y);color:#000;border-color:var(--y)}
#sr{padding-top:8px}#sr[hidden]{display:none}
#q{width:100%;background:var(--p);border:1px solid var(--y);color:var(--t);padding:8px 10px;font:inherit;border-radius:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:1px solid var(--m);color:var(--t);padding:5px 10px;text-transform:uppercase;letter-spacing:1px;font:inherit;font-size:12px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.tabs button b{font-weight:400;color:var(--m);margin-left:4px}
.tabs button.on{background:var(--y);color:#000;border-color:var(--y);font-weight:700}
.tabs button.on b{color:#000}
.t2 button{border-color:#3a6a70;color:var(--c);font-size:11px;padding:4px 9px}
.t2 button.on{background:var(--c);border-color:var(--c);color:#000}
main{padding:12px 12px 12px calc(var(--rail) + 12px)}
#st{color:var(--m);text-align:center;padding:24px 8px}
#st:empty{display:none}
@keyframes gl{0%{transform:none}15%{transform:translateX(-5px);filter:hue-rotate(90deg) saturate(2)}30%{transform:translateX(6px);clip-path:inset(10% 0 40% 0)}45%{transform:translateX(-3px);clip-path:inset(50% 0 10% 0)}60%{transform:translateX(2px);clip-path:none;filter:none}100%{transform:none;filter:none;clip-path:none}}
#list.gl{animation:gl .35s steps(2,end)}
@media(prefers-reduced-motion:reduce){#list.gl{animation:none}}
/* cartes */
.card{position:relative;background:var(--p);border-left:4px solid var(--y);margin-bottom:10px}
.card:active{background:#222}
.card.read{opacity:.62}
.lk{display:flex;gap:10px;padding:10px 46px 10px 10px;text-decoration:none;color:inherit}
.star,.share{position:absolute;right:0;width:46px;background:none;border:0;color:var(--m);cursor:pointer;line-height:1}
.star{top:0;height:46px;font-size:26px}.share{bottom:0;height:40px;font-size:18px}
.star.on{color:var(--y)}
.th{flex:none;width:76px;height:76px;background:#000;border:1px solid #333;overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.fb img{filter:saturate(.8) brightness(.85)}
.bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{align-self:flex-start;font-size:10px;color:#000;background:var(--y);padding:0 6px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.tag.new{background:var(--c)}
.card h3{margin:0;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:11px;color:var(--m)}
.go{color:var(--c);font-size:11px;letter-spacing:1px}
/* vidéos */
.vc{position:relative;background:var(--p);border-left:4px solid var(--c);margin-bottom:12px}
.vc a{display:block;color:inherit;text-decoration:none}
.vt{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.vt::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--y);text-shadow:0 0 14px #000;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.vb{padding:8px 50px 8px 10px;display:flex;flex-direction:column;gap:3px}
.vc .star{top:auto;bottom:0}.vc .share{display:none}
/* étagères */
.sh{color:var(--y);letter-spacing:2px;font-size:12px;margin:16px 0 8px;text-transform:uppercase;border-bottom:1px solid #333;padding-bottom:4px}
.sh:first-child{margin-top:0}
.none{color:var(--m);font-size:13px;padding:6px 0 12px}
.note{color:var(--m);font-size:11px;margin:0 0 10px}
.shop,.uni{display:block;background:var(--p);border-left:4px solid var(--y);padding:10px;margin-bottom:8px;text-decoration:none;color:inherit}
.uni{border-left-color:var(--c)}
.shop:active{background:#222}
.shop .tag{background:var(--c)}
.shop h3,.uni h3{margin:3px 0 2px;font-size:15px;line-height:1.25}
.shop p,.uni p{margin:0;color:var(--m);font-size:12px}
.uni .meta{color:var(--c);letter-spacing:1px;text-transform:uppercase;font-size:10px}
.sub{color:var(--t);font-size:13px;margin:10px 0 5px;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--m);color:var(--t);text-decoration:none;font-size:12px;padding:4px 9px;letter-spacing:1px;text-transform:uppercase}
.chip:active{background:var(--y);color:#000}
/* live */
.panel{background:var(--p);border-left:4px solid var(--y);padding:12px;margin-bottom:10px}
.panel .lab{color:var(--m);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.big{font-size:40px;line-height:1.1;color:var(--y);letter-spacing:2px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid #262626}
.row:first-of-type{border-top:0}
.row a{color:inherit;text-decoration:none}
.px{color:var(--y);font-weight:700;white-space:nowrap}
.px s{color:var(--m);font-weight:400;margin-right:6px}
.off{color:#000;background:var(--c);padding:0 5px;font-size:11px;font-weight:700;margin-left:6px}
/* sorties */
.ev{display:flex;gap:10px;background:var(--p);border-left:4px solid var(--y);padding:10px;margin-bottom:8px}
.ev.past{opacity:.7;border-left-color:#555}
.when{flex:none;width:74px;text-align:center;border:1px solid #333;padding:6px 2px;align-self:flex-start}
.when b{display:block;color:var(--y);font-size:17px;line-height:1.1}
.when span{font-size:10px;color:var(--m);letter-spacing:1px;text-transform:uppercase}
.ev h3{margin:0 0 2px;font-size:15px;line-height:1.25}.ev p{margin:0;font-size:12px;color:var(--m)}
/* quiz */
.qbox{background:var(--p);border-left:4px solid var(--c);padding:12px}
.qbox h3{margin:6px 0 12px;font-size:18px;line-height:1.3}
.qn{color:var(--c);font-size:11px;letter-spacing:2px}
.opt{display:block;width:100%;text-align:left;background:#101010;border:1px solid #444;color:var(--t);padding:10px;margin-bottom:8px;font:inherit}
.opt.ok{border-color:#2bd96b;background:#0c2a18}.opt.ko{border-color:var(--r);background:#2a0c14}
.expl{color:var(--m);font-size:13px;margin:8px 0}
.btn{background:var(--y);color:#000;border:0;padding:10px 18px;font:700 14px inherit;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.score{font-size:46px;color:var(--y);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--y);color:#000;padding:8px 14px;font-weight:700;letter-spacing:1px;z-index:40;display:none}
/* pubs déroulantes à gauche */
#rail{position:fixed;left:0;top:var(--hh);bottom:0;width:var(--rail);background:#050505;border-right:2px solid var(--y);overflow:hidden;z-index:4}
#rail .lab{position:absolute;top:0;left:0;right:0;z-index:2;background:var(--y);color:#000;font-size:9px;letter-spacing:2px;text-align:center;padding:2px 0;font-weight:700}
#track{padding-top:22px;animation:scroll 120s linear infinite;will-change:transform}
#track.paused{animation-play-state:paused}
@keyframes scroll{to{transform:translateY(-50%)}}
.ad{display:block;margin:0 5px 9px;border:1px solid #444;position:relative;cursor:pointer;background:#000}
.ad img{width:100%;display:block}
.ad::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.tad{margin:0 5px 9px;border:1px solid var(--y);background:#000;padding:7px 4px;text-align:center}
.tad b{display:block;color:var(--y);font-size:11px;letter-spacing:1px}
.tad span{display:block;color:var(--t);font-size:9px;line-height:1.2;margin-top:2px}
@media(min-width:520px){.tad b{font-size:14px}.tad span{font-size:11px}}
@media(prefers-reduced-motion:reduce){#track{animation:none}#rail{overflow-y:auto}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#lb.open{display:flex}
#lb img{max-width:min(78vw,340px);max-height:64vh;border:2px solid var(--y)}
#lb b{color:var(--y);letter-spacing:2px;margin-top:12px;font-size:18px}
#lb span{color:var(--m);font-size:12px;letter-spacing:2px;margin-top:2px}
#lb i{color:var(--c);font-size:12px;font-style:normal;margin-top:10px;letter-spacing:1px}
/* comlink */
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;background:var(--y);color:#000;border:0;padding:12px 16px;font:700 14px sans-serif;letter-spacing:2px;display:none}
#chat{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}#chat.open{display:flex}
#ch{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:2px solid var(--y);color:var(--y);letter-spacing:2px}#ch button{background:none;border:1px solid var(--y);color:var(--y)}
#log{flex:1;overflow-y:auto;padding:12px}.msg{max-width:85%;margin:0 0 12px;padding:8px 10px;white-space:pre-wrap}
.ai{background:#1a1800;border-left:3px solid var(--y)}.me{margin-left:auto;background:#001a1c;border-right:3px solid var(--c);text-align:right}
#f{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}#f input{flex:1;background:var(--p);border:1px solid var(--m);color:var(--t);padding:10px;min-width:0}#f button{background:var(--y);border:0;padding:0 16px;font-weight:700}
</style></head><body>
<header id="hd">
 <div class="top"><h1>Night City Feed<small>// CYBERPUNK 2077 · ACTUS EN DIRECT</small></h1>

<script>
// >>> adresse de ton Worker <<<
const API="https://nc-feed.lucasfigeac140702.workers.dev";
const CHAT=false;
const $=id=>document.getElementById(id);
const ADS=window.ADS||[];
const TABS=[["tout","tout"],["jeu","jeu"],["série","série"],["tcg","tcg"],["univers","univers"],["dérivés","dérivés"]];
const TABS2=[["fav","★ favoris"],["vid","▶ vidéos"],["live","● live"],["cal","sorties"],["quiz","quiz"]];
const LABEL={"jeu":"Jeu","série":"Série & film","tcg":"TCG & jeux de table","univers":"Univers","dérivés":"Produits dérivés","vidéo":"Vidéo"};
let cat="tout",DATA=[],VIDS=[],Q="",NEWSET=new Set();
function hh(){document.documentElement.style.setProperty("--hh",$("hd").offsetHeight+"px")}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function ls(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(t){const o=$("toast");o.textContent=t;o.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>o.style.display="none",1800)}
/* favoris */
function favs(){const a=ls("nc_fav",[]);return Array.isArray(a)?a:[]}
function isFav(l){return favs().some(f=>f.link==l)}
function toggleFav(n){
  let a=favs();
  if(a.some(f=>f.link==n.link))a=a.filter(f=>f.link!=n.link);
  else a.unshift({title:n.title,orig:n.orig||"",link:n.link,image:n.image||"",date:n.date||"",source:n.source||"",cat:n.cat,saved:Date.now()});
  lset("nc_fav",a);tabsUI();
}
/* lus / nouveaux */
let READ=new Set(ls("nc_read",[]));
function markRead(l){if(READ.has(l))return;READ.add(l);lset("nc_read",[...READ].slice(-600))}
/* partage */
async function share(n){
  try{if(navigator.share){await navigator.share({title:n.title,url:n.link});return}}catch(e){if(e&&e.name=="AbortError")return}
  try{await navigator.clipboard.writeText(n.link);toast("Lien copié")}catch(e){prompt("Copie le lien :",n.link)}
}
/* onglets */
function mkTabs(box,list){
  list.forEach(([k,l])=>{
    const b=el("button",null);b.dataset.k=k;b.append(document.createTextNode(l),el("b"));
    b.onclick=()=>{if(cat==k)return;cat=k;Q="";$("q").value="";tabsUI();draw();glitch()};box.append(b)});
}
function glitch(){const L=$("list");L.classList.remove("gl");void L.offsetWidth;L.classList.add("gl")}
function tabsUI(){
  if(!$("tabs").children.length){mkTabs($("tabs"),TABS);mkTabs($("tabs2"),TABS2)}
  const F=favs();
  document.querySelectorAll(".tabs button").forEach(b=>{
    const k=b.dataset.k;b.classList.toggle("on",k==cat);
    const n=k=="tout"?DATA.length:k=="fav"?F.length:k=="vid"?VIDS.length:["live","cal","quiz"].includes(k)?0:DATA.filter(a=>a.cat==k).length;
    b.lastChild.textContent=n?n:"";
  });
  hh();
}
const enc=encodeURIComponent,plus=q=>enc(q.trim()).replace(/%20/g,"+"),dash=q=>enc(q.trim().replace(/\s+/g,"-"));
const STORES={
 amz:["Amazon",q=>"https://www.amazon.fr/s?k="+plus(q)],
 fnac:["Fnac",q=>"https://www.fnac.com/SearchResult/ResultList.aspx?Search="+plus(q)],
 ebay:["eBay",q=>"https://www.ebay.fr/sch/i.html?_nkw="+plus(q)],
 etsy:["Etsy",q=>"https://www.etsy.com/fr/search?q="+plus(q)],

 rak:["Rakuten",q=>"https://fr.shopping.rakuten.com/search/"+plus(q)],
 gs:["Google Shopping",q=>"https://www.google.com/search?tbm=shop&q="+plus(q)],
 dis:["Discogs",q=>"https://www.discogs.com/search/?type=all&q="+plus(q)]
};
const FEATURED=[
 ["Boutique officielle","CD PROJEKT RED Gear (Europe)","Figurines, vêtements et goodies : la boutique du studio.","https://eu.gear.cdprojektred.com/"],
 ["Statue","Adam Smasher — statue PVC","Édition officielle sur la boutique CD PROJEKT RED.","https://eu.gear.cdprojektred.com/en-na/products/cyberpunk-2077-adam-smasher-pvc-statue"],
 ["Figurine","Songbird — figurine Dark Horse","Figurine Cyberpunk 2077 chez Dark Horse Direct.","https://darkhorsedirect.com/products/cyberpunk-2077-songbird-figure"],
 ["Statue","Johnny Silverhand — statue PVC 24 cm","Chez Gundam Store.","https://gundam-store.com/products/cyberpunk-2077-pvc-statue-johnny-silverhand-24-cm"],
 ["Collector","Jackie Welles — Dark Horse Comics","Figurine de collection chez Sideshow.","https://www.sideshow.com/collectibles/cyberpunk-2077-jackie-welles-dark-horse-comics-907043"],
 ["Rayon complet","Statues & bustes Cyberpunk 2077","Tous les modèles chez Entertainment Earth.","https://www.entertainmentearth.com/s/cyberpunk-2077/statues-and-busts/tp"],
 ["Edgerunners","Collection Edgerunners — Good Smile Europe","Nendoroid et figurines de l'anime.","https://goodsmileeurope.com/collections/cyberpunk-edgerunners"],
 ["Nendoroid","David Martinez — Nendoroid","Figurine articulée de l'anime, chez HLJ.","https://www.hlj.com/nendoroid-david-cyberpunk-edgerunners-gsc17436"],
 ["Nendoroid","Lucy — Nendoroid","Figurine articulée de l'anime, chez HLJ.","https://www.hlj.com/nendoroid-lucy-cyberpunk-edgerunners-gsc17396"],
 ["Figurine","V (femme) — figurine","Chez Gamekastle.","https://gamekastle.com/products/cyberpunk-2077-female-v-figure"]
];
const SHOP_TYPES=[
 ["Figurines & statues","cyberpunk 2077 figurine",["amz","fnac","ebay","etsy","ali","gs"]],
 ["Figurines Edgerunners","cyberpunk edgerunners figurine",["amz","ebay","ali","etsy","gs"]],
 ["Éditions collector & jeux","cyberpunk 2077 edition collector",["amz","fnac","cdis","rak","ebay"]],
 ["Vêtements & goodies","cyberpunk 2077 hoodie t-shirt",["amz","etsy","ali","ebay","gs"]],
 ["Artbooks, comics & mangas","cyberpunk 2077 artbook comics",["amz","fnac","ebay","rak"]],
 ["Vinyles & musique","cyberpunk 2077 vinyl",["dis","amz","fnac","ebay"]],
 ["Jeux de cartes & de société","cyberpunk jeu de cartes jeu de société",["amz","fnac","ebay","gs"]]
];
const UNIVERSES=[
 ["Akira","Manga 1982 · film 1988","Neo-Tokyo, motards, pouvoirs psychiques : le monument de Katsuhiro Otomo.","Akira manga","Akira manga film","Akira manga"],
 ["Neuromancien","Roman 1984","Le roman de William Gibson qui a fixé les codes du genre : cyberespace, hackers, IA.","Neuromancien","Neuromancer William Gibson","Neuromancien William Gibson"],
 ["Blade Runner","Film 1982 · 2049","Los Angeles pluvieux, réplicants et chasseurs de primes, d'après Philip K. Dick.","Blade Runner","Blade Runner","Blade Runner"],
 ["Ghost in the Shell","Manga 1989 · anime","Cyborgs, esprit et corps numérisés, dans la police du futur de Masamune Shirow.","Ghost in the Shell","Ghost in the Shell","Ghost in the Shell"],
 ["Cyberpunk (jeu de rôle)","Jeu de table · Mike Pondsmith","Le jeu de rôle d'origine, dont Cyberpunk 2077 est tiré. Dernière édition : Cyberpunk RED.","Cyberpunk jeu de rôle","Cyberpunk RED","Cyberpunk RED jeu de rôle"],
 ["Shadowrun","Jeu de rôle 1989","Cyberpunk mélangé à la fantasy : magie, elfes et mégacorporations.","Shadowrun","Shadowrun","Shadowrun jeu de rôle"],
 ["Altered Carbon","Roman 2002 · série Netflix","Les consciences se sauvegardent dans des « piles » et changent de corps.","Altered Carbon","Altered Carbon","Altered Carbon"],
 ["Deus Ex","Jeu vidéo 2000","Complots, augmentations et choix du joueur dans un futur proche.","Deus Ex","Deus Ex","Deus Ex"],
 ["Snow Crash","Roman 1992","Le « Samouraï virtuel » de Neal Stephenson : métavers, pizza mafieuse et virus mental.","Snow Crash","Snow Crash","Snow Crash Neal Stephenson"],
 ["Cyberpunk : Edgerunners","Anime 2022 · Studio Trigger","L'anime de l'univers de Cyberpunk 2077 : David, Lucy et les mercenaires de Night City.","Cyberpunk: Edgerunners","Cyberpunk Edgerunners","Cyberpunk Edgerunners"]
];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function chip(label,href){const a=el("a","chip",label);a.href=href;a.target="_blank";a.rel="noopener";return a}
function shopShelf(){
  const f=document.createDocumentFragment();
  f.append(el("div","sh","Où acheter — sélection"));
  f.append(el("p","note","Liens vers des boutiques en ligne (non affiliées). Prix et stocks varient, vérifie sur le site."));

    const a=el("a","shop");a.href=u;a.target="_blank";a.rel="noopener";
    a.append(el("span","tag",tg),el("h3",null,t),el("p",null,d),el("span","go","ACHETER ▸"));f.append(a)});
  f.append(el("div","sh","Chercher par type de produit"));

function uniShelf(){

/* chargement : 4 groupes de sources */
function norm(t){return(t||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function dedupe(arr){
  const sl=new Set(),st=new Set();
  return arr.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).filter(a=>{
    const k=norm(a.orig||a.title);if(sl.has(a.link)||st.has(k))return false;sl.add(a.link);st.add(k);return true}).slice(0,250);
}
let loading=false;
async function getPart(i){
  const r=await fetch(API+"/news?part="+i,{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();const items=Array.isArray(d)?d:d.items;if(!Array.isArray(items))throw new Error("Réponse inattendue");
  return{items,parts:Array.isArray(d)?1:(d.parts||1)};
}
function finishKnown(){
  const known=ls("nc_known",null);

  if(Array.isArray(known)&&known.length)NEWSET=new Set(cur.filter(l=>!known.includes(l)));
  lset("nc_known",[...new Set(cur.concat(known||[]))].slice(0,500));
}
async function load(){
  if(loading)return;loading=true;
  const OLD=DATA,fresh=[];let done=0,total=4,err="";
  const upd=()=>{DATA=dedupe(fresh.concat(OLD));tabsUI();if(["tout","jeu","série","tcg","univers","dérivés"].includes(cat))draw();
    if(!DATA.length)$("st").textContent=done<total?"Chargement des sources… "+done+"/"+total:"Aucune actu Cyberpunk 2077 trouvée pour l'instant."};
  try{
    try{const f=await getPart(0);total=f.parts;fresh.push(...f.items)}catch(e){err=e&&e.message?e.message:String(e)}
    done=1;upd();
    await Promise.all(Array.from({length:Math.max(0,total-1)},(_,k)=>getPart(k+1).then(p=>{fresh.push(...p.items)}).catch(e=>{err=err||(e&&e.message?e.message:String(e))}).then(()=>{done++;upd()})));
    if(fresh.length){DATA=dedupe(fresh.slice());finishKnown();tabsUI();if(!["live","cal","quiz","vid"].includes(cat))draw();lset("nc_data3",DATA)}
    else if(!OLD.length)$("st").textContent="Signal perdu : "+(err||"aucune réponse")+" | API = "+API;
  }finally{loading=false}
}
