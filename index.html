<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcee0a"><meta name="google" content="notranslate">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>NIGHT CITY FEED</title>
<style>
:root{--y:#fcee0a;--bg:#0b0b0b;--p:#151515;--t:#e8e8e8;--m:#8a8a8a;--c:#00f0ff;--rail:72px;--hh:110px}
@media(min-width:520px){:root{--rail:120px}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 "Rajdhani","Segoe UI",Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:2px solid var(--y);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
h1{margin:0;font-size:22px;letter-spacing:3px;color:var(--y);text-transform:uppercase}
h1 small{display:block;font-size:11px;color:var(--m);letter-spacing:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:1px solid var(--m);color:var(--t);padding:5px 10px;text-transform:uppercase;letter-spacing:1px;font:inherit;font-size:12px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.tabs button b{font-weight:400;color:var(--m);margin-left:4px}
.tabs button.on{background:var(--y);color:#000;border-color:var(--y);font-weight:700}
.tabs button.on b{color:#000}
main{padding:12px 12px 12px calc(var(--rail) + 12px)}
#st:empty{display:none}
#st{color:var(--m);text-align:center;padding:24px 8px}
.card{position:relative;background:var(--p);border-left:4px solid var(--y);margin-bottom:10px}
.card:active{background:#222}
.lk{display:flex;gap:10px;padding:10px 46px 10px 10px;text-decoration:none;color:inherit}
.star{position:absolute;top:0;right:0;width:46px;height:46px;background:none;border:0;color:var(--m);font-size:26px;line-height:1;cursor:pointer}
.star.on{color:var(--y)}
.th{flex:none;width:76px;height:76px;background:#000;border:1px solid #333;overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.fb img{filter:saturate(.8) brightness(.85)}
.bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.tag{align-self:flex-start;font-size:10px;color:#000;background:var(--y);padding:0 6px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.card h3{margin:0;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:11px;color:var(--m)}
.go{color:var(--c);font-size:11px;letter-spacing:1px}
/* pubs déroulantes à gauche */
#rail{position:fixed;left:0;top:var(--hh);bottom:0;width:var(--rail);background:#050505;border-right:2px solid var(--y);overflow:hidden;z-index:4}
#rail .lab{position:absolute;top:0;left:0;right:0;z-index:2;background:var(--y);color:#000;font-size:9px;letter-spacing:2px;text-align:center;padding:2px 0;font-weight:700}
#track{padding-top:22px;animation:scroll 110s linear infinite;will-change:transform}
#track.paused{animation-play-state:paused}
@keyframes scroll{to{transform:translateY(-50%)}}
.ad{display:block;margin:0 5px 9px;border:1px solid #444;position:relative;cursor:pointer;background:#000}
.ad img{width:100%;display:block}
.ad::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
@media(prefers-reduced-motion:reduce){#track{animation:none}#rail{overflow-y:auto}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#lb.open{display:flex}
#lb img{max-width:min(78vw,340px);max-height:68vh;border:2px solid var(--y)}
#lb b{color:var(--y);letter-spacing:2px;margin-top:12px;font-size:18px}
#lb span{color:var(--m);font-size:12px;letter-spacing:2px;margin-top:2px}
/* comlink */
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;background:var(--y);color:#000;border:0;padding:12px 16px;font:700 14px sans-serif;letter-spacing:2px;display:none}
#chat{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}#chat.open{display:flex}
#ch{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:2px solid var(--y);color:var(--y);letter-spacing:2px}#ch button{background:none;border:1px solid var(--y);color:var(--y)}
#log{flex:1;overflow-y:auto;padding:12px}.msg{max-width:85%;margin:0 0 12px;padding:8px 10px;white-space:pre-wrap}
.ai{background:#1a1800;border-left:3px solid var(--y)}.me{margin-left:auto;background:#001a1c;border-right:3px solid var(--c);text-align:right}
#f{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}#f input{flex:1;background:var(--p);border:1px solid var(--m);color:var(--t);padding:10px;min-width:0}#f button{background:var(--y);border:0;padding:0 16px;font-weight:700}
</style></head><body>
<header id="hd"><h1>Night City Feed<small>// CYBERPUNK 2077 · ACTUS EN DIRECT</small></h1><div class="tabs" id="tabs"></div></header>
<aside id="rail"><div class="lab">PUBLICITÉ</div><div id="track"></div></aside>
<main><div id="st">Connexion au réseau…</div><div id="list"></div></main>
<div id="lb"><img id="lbi" alt=""><b id="lbn"></b><span id="lbt"></span></div>
<button id="fab">▸ COMLINK</button>
<section id="chat"><div id="ch"><span>// COMLINK</span><button id="close">FERMER</button></div><div id="log"></div>
<form id="f"><input id="in" placeholder="Écris ton message…" autocomplete="off"><button>ENVOYER</button></form></section>
<script src="ads.js"></script>
<script>
// >>> adresse de ton Worker <<<
const API="https://nc-feed.lucasfigeac140702.workers.dev";
const CHAT=false; // true si tu as ajouté ANTHROPIC_API_KEY au Worker
const $=id=>document.getElementById(id);
const ADS=window.ADS||[];
const TABS=[["tout","tout"],["jeu","jeu"],["série","série"],["tcg","tcg"],["univers","univers"],["dérivés","dérivés"],["fav","★ favoris"]];
const LABEL={"jeu":"Jeu","série":"Série & film","tcg":"TCG & jeux de table","univers":"Univers","dérivés":"Produits dérivés"};
let cat="tout",DATA=[];
function hh(){document.documentElement.style.setProperty("--hh",$("hd").offsetHeight+"px")}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
/* favoris (gardés sur ce téléphone) */
function favs(){try{const a=JSON.parse(localStorage.getItem("nc_fav")||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveFavs(a){try{localStorage.setItem("nc_fav",JSON.stringify(a))}catch(e){}}
function isFav(link){return favs().some(f=>f.link==link)}
function toggleFav(n){
  let a=favs();
  if(a.some(f=>f.link==n.link))a=a.filter(f=>f.link!=n.link);
  else a.unshift({title:n.title,link:n.link,image:n.image||"",date:n.date||"",source:n.source||"",cat:n.cat,saved:Date.now()});
  saveFavs(a);tabsUI();
}
/* onglets */
function tabsUI(){
  const T=$("tabs");
  if(!T.children.length)TABS.forEach(([k,l])=>{
    const b=document.createElement("button");b.dataset.k=k;b.append(document.createTextNode(l));
    const c=document.createElement("b");b.append(c);
    b.onclick=()=>{cat=k;tabsUI();draw()};T.append(b)});
  const F=favs();
  [...T.children].forEach(b=>{
    const k=b.dataset.k;b.className=k==cat?"on":"";
    const n=k=="tout"?DATA.length:k=="fav"?F.length:DATA.filter(a=>a.cat==k).length;
    b.lastChild.textContent=(DATA.length||k=="fav")&&n?n:"";
  });
  hh();
}
/* articles */
function draw(){
  const L=$("list");L.innerHTML="";
  let d;
  if(cat=="fav"){d=favs();$("st").textContent=d.length?"":"Aucun favori pour l'instant. Appuie sur ☆ sur un article pour le garder ici."}
  else{d=DATA.filter(a=>cat=="tout"||a.cat==cat);$("st").textContent=d.length?"":(DATA.length?"Rien de neuf dans cet onglet pour l'instant.":"")}
  d.forEach(n=>{
    const card=document.createElement("div");card.className="card";
    const a=document.createElement("a");a.className="lk";a.href=n.link;a.target="_blank";a.rel="noopener";
    const th=document.createElement("div");th.className="th";
    const im=document.createElement("img");im.alt="";im.loading="lazy";im.referrerPolicy="no-referrer";
    const fb=()=>{if(ADS.length){th.classList.add("fb");im.src=ADS[hash(n.link)%ADS.length].s}};
    if(n.image){im.src=n.image;im.onerror=()=>{im.onerror=null;fb()}}else fb();
    th.append(im);
    const bd=document.createElement("div");bd.className="bd";
    const tg=document.createElement("span");tg.className="tag";tg.textContent=LABEL[n.cat]||n.cat;
    const h=document.createElement("h3");h.textContent=n.title;
    const m=document.createElement("div");m.className="meta";
    m.textContent=(n.source||"")+(n.date?" · "+new Date(n.date).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"");
    const g=document.createElement("span");g.className="go";g.textContent="ACCÉDER ▸";
    bd.append(tg,h,m,g);a.append(th,bd);
    const s=document.createElement("button");s.className="star";s.setAttribute("aria-label","Favori");
    const paint=()=>{const on=isFav(n.link);s.textContent=on?"★":"☆";s.classList.toggle("on",on)};paint();
    s.onclick=e=>{e.preventDefault();e.stopPropagation();toggleFav(n);if(cat=="fav")draw();else paint()};
    card.append(a,s);L.append(card);
  });
}
/* chargement : 4 groupes de sources, affichés au fur et à mesure */
function norm(t){return(t||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function dedupe(arr){
  const sl=new Set(),st=new Set();
  return arr.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).filter(a=>{
    const k=norm(a.orig||a.title);if(sl.has(a.link)||st.has(k))return false;sl.add(a.link);st.add(k);return true}).slice(0,250);
}
let loading=false;
async function getPart(i){
  const r=await fetch(API+"/news?part="+i,{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();const items=Array.isArray(d)?d:d.items;if(!Array.isArray(items))throw new Error("Réponse inattendue");
  return{items,parts:Array.isArray(d)?1:(d.parts||1)};
}
async function load(){
  if(loading)return;loading=true;
  const OLD=DATA,fresh=[];let done=0,total=4,err="";
  const upd=()=>{DATA=dedupe(fresh.concat(OLD));tabsUI();draw();
    if(!DATA.length)$("st").textContent=done<total?"Chargement des sources… "+done+"/"+total:"Aucune actu Cyberpunk 2077 trouvée pour l'instant."};
  try{
    try{const f=await getPart(0);total=f.parts;fresh.push(...f.items)}catch(e){err=e&&e.message?e.message:String(e)}
    done=1;upd();
    await Promise.all(Array.from({length:Math.max(0,total-1)},(_,k)=>getPart(k+1).then(p=>{fresh.push(...p.items)}).catch(e=>{err=err||(e&&e.message?e.message:String(e))}).then(()=>{done++;upd()})));
    if(fresh.length){DATA=dedupe(fresh.slice());tabsUI();draw();try{localStorage.setItem("nc_data3",JSON.stringify(DATA))}catch(e){}}
    else if(!OLD.length)$("st").textContent="Signal perdu : "+(err||"aucune réponse")+" | API = "+API;
  }finally{loading=false}
}
try{const c=JSON.parse(localStorage.getItem("nc_data3")||"[]");if(Array.isArray(c)&&c.length){DATA=c}}catch(e){}
tabsUI();draw();load();setInterval(load,600000);
/* pubs défilantes (affiches) */
(function(){
  if(!ADS.length){$("rail").style.display="none";document.querySelector("main").style.paddingLeft="12px";return}
  const track=$("track");
  const order=ADS.slice().sort(()=>Math.random()-.5);
  [0,1].forEach(()=>order.forEach(a=>{
    const d=document.createElement("div");d.className="ad";
    const i=document.createElement("img");i.src=a.s;i.alt=a.n;i.loading="lazy";d.append(i);
    d.onclick=()=>{$("lbi").src=a.s;$("lbn").textContent=a.n;$("lbt").textContent=a.t;$("lb").classList.add("open")};
    track.append(d)}));
  track.addEventListener("pointerdown",()=>track.classList.add("paused"));
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>track.addEventListener(ev,()=>track.classList.remove("paused")));
  $("lb").onclick=()=>$("lb").classList.remove("open");
})();
addEventListener("resize",hh);
/* comlink (optionnel) */
if(CHAT){$("fab").style.display="block";const hist=[];
  const add=(w,t)=>{const d=document.createElement("div");d.className="msg "+w;d.textContent=t;$("log").append(d);$("log").scrollTop=1e9;return d};
  $("fab").onclick=()=>{$("chat").classList.add("open");if(!$("log").children.length)add("ai","Connexion établie. Que cherches-tu, choom ?")};
  $("close").onclick=()=>$("chat").classList.remove("open");
  $("f").onsubmit=async e=>{e.preventDefault();const t=$("in").value.trim();if(!t)return;$("in").value="";add("me",t);hist.push({role:"user",content:t});
    const o=add("ai","…");try{const r=await fetch(API+"/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:hist})});
      const d=await r.json();o.textContent=d.text||"Signal perdu.";hist.push({role:"assistant",content:d.text})}catch{o.textContent="Signal perdu.";hist.pop()}}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
