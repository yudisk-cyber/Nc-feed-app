/* TCG */
details.rule{background:var(--p);border-left:4px solid var(--y);margin-bottom:8px}

 <div class="top"><h1>Night City Feed<small>// CYBERPUNK 2077 · EN DIRECT</small></h1>

<script>
// >>> adresse de ton Worker <<<
const API="https://nc-feed.lucasfigeac140702.workers.dev";
const CHAT=false;
const $=id=>document.getElementById(id);
const ADS=window.ADS||[];
const TABS=[["tout","tout"],["jeu","jeu"],["série","série"],["tcg","tcg"],["univers","univers"],["dérivés","dérivés"]];
const NEWSCATS=["tout","jeu","série","tcg","univers","dérivés"];
const SEC={actus:NEWSCATS.map(k=>[k,k]),tcg:[["tr","Règles"],["tc","Cartes"]],plus:[["cal","Sorties"],["quiz","Quiz"]]};
const NAV=[["actus","▤","Actus"],["vid","▶","Vidéos"],["live","●","Live"],["tcg","◈","TCG"],["plus","⋯","Plus"]];
const LAST={actus:"tout",tcg:"tr",plus:"cal"};
function secOf(c){for(const s in SEC)if(SEC[s].some(x=>x[0]==c))return s;return c}
const inNews=()=>NEWSCATS.includes(cat);
const LABEL={"jeu":"Jeu","série":"Série & film","tcg":"TCG & jeux de table","univers":"Univers","dérivés":"Produits dérivés","vidéo":"Vidéo"};
let cat="tout",DATA=[],VIDS=[],Q="",NEWSET=new Set();
function hh(){document.documentElement.style.setProperty("--hh",$("hd").offsetHeight+"px")}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function ls(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(t){const o=$("toast");o.textContent=t;o.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>o.style.display="none",1800)}
/* favoris */
function favs(){const a=ls("nc_fav",[]);return Array.isArray(a)?a:[]}
function isFav(l){return favs().some(f=>f.link==l)}
function toggleFav(n){
  let a=favs();
  if(a.some(f=>f.link==n.link))a=a.filter(f=>f.link!=n.link);
  else a.unshift({title:n.title,orig:n.orig||"",link:n.link,image:n.image||"",date:n.date||"",source:n.source||"",cat:n.cat,saved:Date.now()});
  lset("nc_fav",a);tabsUI();
}
/* lus / nouveaux */
let READ=new Set(ls("nc_read",[]));
function markRead(l){if(READ.has(l))return;READ.add(l);lset("nc_read",[...READ].slice(-600))}
/* partage */
async function share(n){
  try{if(navigator.share){await navigator.share({title:n.title,url:n.link});return}}catch(e){if(e&&e.name=="AbortError")return}
  try{await navigator.clipboard.writeText(n.link);toast("Lien copié")}catch(e){prompt("Copie le lien :",n.link)}
}
/* onglets */
function go(k){
  if(SEC[k])k=LAST[k];
  if(cat==k)return;
  cat=k;const s=secOf(k);if(LAST[s]!==undefined)LAST[s]=k;
  Q="";$("q").value="";tabsUI();draw();glitch();scrollTo(0,0);
  if(k=="live"){if(Date.now()-statsT>3e4){statsT=Date.now();loadStats()}}
  if(k=="vid"&&!VIDS.length)loadVids(true);
}
function glitch(){const L=$("list");L.classList.remove("gl");void L.offsetWidth;L.classList.add("gl")}
function tabsUI(){
  const T=$("tabs"),sec=secOf(cat),sub=SEC[sec];
  if(!$("nav").children.length){
    NAV.forEach(([k,ic,l])=>{const b=el("button",null);b.dataset.k=k;b.append(el("i",null,ic),document.createTextNode(l),el("b"));b.onclick=()=>go(k);$("nav").append(b)});
    $("fv").onclick=()=>go(cat=="fav"?LAST.actus:"fav");
  }
  const key=sec+"|"+(sub?"1":"0");
  if(T.dataset.key!=key){T.dataset.key=key;T.innerHTML="";
    if(sub)sub.forEach(([k,l])=>{const b=el("button",null);b.dataset.k=k;b.append(document.createTextNode(l),el("b"));b.onclick=()=>go(k);T.append(b)})}

/* TCG : règles + liste des cartes */
const RULES=[
 ["But du jeu",`<p>Tu gagnes si tu commences ton tour avec <b>7 Gigs</b> (dés) dans ta zone de Gigs. Tu ne gagnes pas à l'instant où tu prends le 7ᵉ : il faut le garder jusqu'au début de ton tour suivant.</p><p>Tu perds si tu dois piocher et que ton deck est vide.</p>`],
 ["Ce qu'il te faut",`<ul><li>Un <b>deck de 40 à 50 cartes</b> (maximum 3 exemplaires du même nom et sous-titre).</li><li><b>3 Légendes</b> de noms différents, gardées hors du deck.</li><li>Six dés : d4, d6, d8, d10, d12 et d20, rangés dans ta zone <span class="kw">Fixer</span>.</li><li>Des cartes de <b>4 couleurs</b> : <span class="dot cr"></span>rouge, <span class="dot cy"></span>jaune, <span class="dot cg"></span>vert, <span class="dot cb"></span>bleu. La <span class="kw">RAM</span> de tes Légendes limite les couleurs que ton deck peut jouer.</li></ul><p>Format « Beta Sealed » (partie avec boosters) : 30 cartes minimum, 3 couleurs maximum, sans contrainte de RAM.</p>`],
 ["Les types de cartes",`<ul><li><b>Légende</b> : ton chef d'équipe. Face cachée au départ, tu la révèles en payant 1 €$ (« appeler »). Elle peut aussi servir à payer un coût.</li><li><b>Unité</b> : un personnage qui entre sur le terrain, attaque et bloque.</li><li><b>Équipement (Gear)</b> : tu paies son coût pour l'attacher à une de tes Unités ou à une Légende révélée.</li><li><b>Programme</b> : tu paies son coût, l'effet se résout, puis la carte va à la défausse.</li></ul><p>Le coût est en €$ (eddies), en haut à gauche de la carte.</p>`],
 ["Mise en place",`<ol><li>Chacun mélange son deck. Un tirage au sort désigne qui choisit le premier joueur.</li><li>Place tes 3 Légendes face cachée, dans un ordre aléatoire.</li><li>Le premier joueur dépense ses deux Légendes les plus à gauche : elles ne se redressent pas à son premier tour.</li><li>Pioche 6 cartes. Tu as droit à <b>un seul mulligan</b> : tu remets ta main, tu mélanges et tu repioches 6.</li></ol>`],
 ["Déroulement d'un tour",`<p><b>1. Début de tour</b></p><ul><li>Vérifie la condition de victoire (7 Gigs).</li><li>Redresse tes cartes dépensées, pioche 1 carte.</li><li>Lance un dé de ta zone Fixer : il rejoint ta zone de Gigs. Le d20 ne peut être pris que s'il ne reste aucun autre dé.</li></ul><p><b>2. Phase principale</b> (dans l'ordre que tu veux)</p><ul><li><b>Vendre une carte</b> (une fois par tour) pour gagner un eddie.</li><li><b>Appeler une Légende</b> (une fois par tour, 1 €$).</li><li>Jouer des Unités, Équipements et Programmes en payant leur coût.</li><li>Activer des effets, <b>attaquer</b> avec tes Unités prêtes.</li></ul><p><b>3. Fin de tour</b> : toutes les Unités perdent <span class="kw">Lag</span>.</p>`],
 ["Combat et vol de Gigs",`<ul><li>Une Unité <b>prête</b> peut s'épuiser pour attaquer : soit une Unité adverse épuisée (un combat), soit la <b>zone de Gigs</b> adverse.</li><li>Avant la résolution, l'adversaire a une fenêtre de réaction : effets <span class="kw">Quick</span>, Unités <span class="kw">Blocker</span> qui reprennent l'attaque, appel d'une Légende.</li><li>Un combat compare les <b>Puissances</b> des Unités.</li><li>Si l'attaque touche les Gigs, tu <b>voles</b> des dés à l'adversaire : ils passent dans ta zone.</li><li><b>Street Cred</b> = total des faces de tes dés. Chaque dé compte pour 1 Gig, quelle que soit sa valeur ; la valeur compte pour la Street Cred et certains effets.</li></ul>`],
 ["Mots-clés",`<ul><li><span class="kw">Lag</span> : une Unité qui vient d'arriver ne peut pas attaquer ni payer un coût qui l'épuise. Elle perd Lag à la fin du tour.</li><li><span class="kw">Adrenaline</span> (Go Solo) : l'Unité peut attaquer dès le tour où elle est jouée.</li><li><span class="kw">Blocker</span> : l'attaque adverse peut être redirigée vers cette Unité.</li><li><span class="kw">Quick</span> : effet jouable pendant la fenêtre de réaction.</li></ul>`],
 ["Rareté des cartes",`<ul><li>Commune, Peu commune, Rare, Épique, Secrète.</li><li><b>Iconique</b> : versions alternatives de certaines cartes (Légendes, cartes clés, et quelques Secrètes).</li></ul><p>Utilise l'onglet « Cartes » pour trier et filtrer toute la liste.</p>`],
 ["Pour aller plus loin",`<p>Ce résumé est <b>non officiel</b> et simplifié, basé sur des guides de la communauté ; les règles ont évolué entre la bêta et la sortie en boutique. En cas de doute, la référence est le livret de règles officiel.</p><div class="chips"><a class="chip" target="_blank" rel="noopener" href="https://cyberpunktcg.com/">Site officiel</a><a class="chip" target="_blank" rel="noopener" href="https://cyberpunktcg.wiki/rules/">Guide des règles</a><a class="chip" target="_blank" rel="noopener" href="https://anketsu.com/cyberpunk-tcg-rules/">Guide débutant</a></div>`]
];

}

function norm(t){return(t||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function dedupe(arr){
  const sl=new Set(),st=new Set();
  return arr.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).filter(a=>{
    const k=norm(a.orig||a.title);if(sl.has(a.link)||st.has(k))return false;sl.add(a.link);st.add(k);return true}).slice(0,250);
}

async function getPart(i){
  const r=await fetch(API+"/news?part="+i,{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();const items=Array.isArray(d)?d:d.items;if(!Array.isArray(items))throw new Error("Réponse inattendue");
  return{items,parts:Array.isArray(d)?1:(d.parts||1)};
}
function finishKnown(){
  const known=ls("nc_known",null);
  const cur=DATA.map(a=>a.link);
  if(Array.isArray(known)&&known.length)NEWSET=new Set(cur.filter(l=>!known.includes(l)));
  lset("nc_known",[...new Set(cur.concat(known||[]))].slice(0,500));
}
async function load(){
  if(loading)return;loading=true;
  const OLD=DATA,fresh=[];let done=0,total=4,err="";
  const upd=()=>{DATA=dedupe(fresh.concat(OLD));tabsUI();if(inNews())draw();
    if(!DATA.length)$("st").textContent=done<total?"Chargement des sources… "+done+"/"+total:"Aucune actu Cyberpunk 2077 trouvée pour l'instant."};
  try{
    try{const f=await getPart(0);total=f.parts;fresh.push(...f.items)}catch(e){err=e&&e.message?e.message:String(e)}
    done=1;upd();
    await Promise.all(Array.from({length:Math.max(0,total-1)},(_,k)=>getPart(k+1).then(p=>{fresh.push(...p.items)}).catch(e=>{err=err||(e&&e.message?e.message:String(e))}).then(()=>{done++;upd()})));
    if(fresh.length){DATA=dedupe(fresh.slice());finishKnown();tabsUI();if(inNews()||cat=="fav")draw();lset("nc_data3",DATA)}
    else if(!OLD.length)$("st").textContent="Signal perdu : "+(err||"aucune réponse")+" | API = "+API;
  }finally{loading=false}
}
